# https://docs.typo3.org/m/typo3/reference-coreapi/14.3/en-us/ExtensionArchitecture/FileStructure/Configuration/ServicesYaml.html

services:
  # https://docs.typo3.org/m/typo3/reference-coreapi/14.3/en-us/ApiOverview/DependencyInjection/Index.html
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  VendorName\Sitepackage\:
    resource: '../Classes/*'
    exclude: '../Classes/Domain/Model/*'
